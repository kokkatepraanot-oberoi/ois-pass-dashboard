name: Run PASS code patches

on:
  push:
    paths:
      - '.patch-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python .github/scripts/patch_labels.py
          python .github/scripts/patch_specialist_queue.py
          python .github/scripts/patch_specialist_render.py
          python .github/scripts/patch_persistence.py
          python .github/scripts/patch_specialist_metrics.py
          python .github/scripts/patch_explicit_labels.py
          python .github/scripts/patch_plain_english.py
          python -m py_compile app.py pass_logic.py storage.py specialist_guidance.py persistent_actions.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pass_logic.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clarify specialist PASS views and persistent actions"
          git push

name: Migrate PASS dashboard to school Google login

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-auth-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shared password with Google OIDC
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          gate = base64.b64decode('').decode()
          p = Path('app.py')
          text = p.read_text()
          pattern = r'def password_gate\(\) -> None:\n.*?\n\ndef interpretation_note\(\) -> None:'
          text, count = re.subn(pattern, gate + '\n\ndef interpretation_note() -> None:', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace password_gate')
          text = text.replace('password_gate()\n\nst.title(', 'google_auth_gate()\n\nst.title(', 1)
          old = 'with st.sidebar:\n    st.caption(f"Signed in as **{st.session_state.get(\'staff_name\', \'OIS staff\')}**")\n    if st.button("Log out", use_container_width=True):\n        st.session_state.pop("pass_authenticated", None)\n        st.session_state.pop("staff_name", None)\n        st.rerun()\n    st.divider()\n'
          new = 'with st.sidebar:\n    st.caption(f"Signed in as **{st.session_state.get(\'staff_name\', \'OIS staff\')}**")\n    st.caption(st.session_state.get("staff_email", ""))\n    st.button("Log out", on_click=st.logout, use_container_width=True)\n    st.divider()\n'
          if old not in text:
              raise SystemExit('Could not replace sidebar logout block')
          text = text.replace(old, new, 1)
          text = text.replace('The role selector changes the analysis view; it is not role-based access control. Everyone with the current app password can switch views.', 'The role selector changes the analysis view; it is not role-based access control. Google sign-in secures access to OIS staff accounts. Role-based permissions are still separate from authentication, so authorised users can currently switch views.', 1)
          p.write_text(text)
          Path('requirements.txt').write_text('streamlit>=1.42,<2\npandas>=2.2,<3\nopenpyxl>=3.1,<4\nplotly>=5.24,<7\nAuthlib>=1.3.2,<2\n')
          PY
      - name: Verify Python syntax
        run: python -m py_compile app.py pass_logic.py
      - name: Commit migration
        shell: bash
        run: |
          rm .github/workflows/google-auth-migration.yml
          git config user.name "OIS PASS Dashboard Automation"
          git config user.email "praanot.kokkate@oberoi-is.org"
          git add -A
          git commit -m "Use OIS Google Workspace login"
          git push

name: Fix historical grade context

on:
  push:
    paths:
      - '.historical-grade-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add inferred grade-at-survey and correct cohort labels
        run: |
          python - <<'PY'
          from pathlib import Path

          logic = Path('pass_logic.py')
          text = logic.read_text()
          old = '''    out["Wave"] = pd.to_datetime(out["Wave key"]).dt.strftime("%b %Y")\n\n    factor_columns = list(schema.factor_cols.values())'''
          new = '''    out["Wave"] = pd.to_datetime(out["Wave key"]).dt.strftime("%b %Y")\n\n    # Testwise applies the student's CURRENT year/group to historical rows.\n    # Infer the year the student would have been in at each survey wave so\n    # cohort trend charts do not imply, for example, that a current Year 6\n    # student was already in Year 6 in 2024. This is an inferred progression\n    # based on academic-year movement and is labelled as such in the UI.\n    current_grade_num = pd.to_numeric(out["Grade"].str.extract(r"(\\d+)")[0], errors="coerce")\n    wave_dates = pd.to_datetime(out["Wave key"], errors="coerce")\n    latest_wave_date = wave_dates.max()\n    if pd.notna(latest_wave_date):\n        latest_ay_start = latest_wave_date.year if latest_wave_date.month >= 7 else latest_wave_date.year - 1\n        wave_ay_start = wave_dates.dt.year.where(wave_dates.dt.month >= 7, wave_dates.dt.year - 1)\n        inferred_grade_num = current_grade_num - (latest_ay_start - wave_ay_start)\n        out["Grade at survey (inferred)"] = inferred_grade_num.apply(\n            lambda value: f"Year {int(value)}" if pd.notna(value) and value >= 1 else "Unknown"\n        )\n    else:\n        out["Grade at survey (inferred)"] = "Unknown"\n\n    factor_columns = list(schema.factor_cols.values())'''
          if old not in text:
              raise SystemExit('PASS wave block not found')
          logic.write_text(text.replace(old, new, 1))

          app = Path('app.py')
          text = app.read_text()
          old = '''    trend["Series"] = trend["Factor"].apply(lambda n: f"F{int(n)}")\n    fig = px.line(\n        trend.sort_values("Wave sort"),\n        x="Wave",'''
          new = '''    trend["Series"] = trend["Factor"].apply(lambda n: f"F{int(n)}")\n    x_col = "Wave"\n    if "Grade at survey (inferred)" in history_df.columns and history_df["Grade"].nunique() == 1:\n        wave_context = (\n            history_df[["Wave", "Wave key", "Grade at survey (inferred)"]]\n            .sort_values("Wave key")\n            .drop_duplicates(subset=["Wave"], keep="last")\n        )\n        grade_map = dict(zip(wave_context["Wave"], wave_context["Grade at survey (inferred)"]))\n        trend["Wave display"] = trend["Wave"].map(\n            lambda wave: f"{wave}<br><sup>{grade_map.get(wave, '')}*</sup>"\n        )\n        x_col = "Wave display"\n    fig = px.line(\n        trend.sort_values("Wave sort"),\n        x=x_col,'''
          if old not in text:
              raise SystemExit('Trend chart block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'trend_line_chart(history, schema, f"{grade}: trend by factor (% at/under 20th percentile)")',
              'trend_line_chart(history, schema, f"Current {grade} cohort: PASS journey over time (% at/under 20th percentile)")\n            st.caption("* Earlier year labels are inferred from the student’s current year and survey date because Testwise stamps the current year/group onto historical rows. For current Year 6, the 2024–26 points are Primary PASS results until Sep 2026.")',
              1,
          )
          text = text.replace(
              'transition_chart(history, schema, f"{grade}: latest wave vs previous wave")',
              'transition_chart(history, schema, f"Current {grade} cohort: latest wave vs previous wave")',
              1,
          )
          old_spec = 'trend_line_chart(history, schema, f"{scope}: specialist trend over time", factors=factors)'
          new_spec = '''trend_title = "Whole Middle School: specialist trend over time" if scope == "Whole Middle School" else f"Current {scope} cohort: specialist PASS journey over time"\n            trend_line_chart(history, schema, trend_title, factors=factors)\n            if scope != "Whole Middle School":\n                st.caption("* Earlier year labels are inferred from the student’s current year and survey date. Testwise stamps current year/group labels onto historical rows, so earlier points may be Primary results for current Year 6 students.")'''
          if old_spec not in text:
              raise SystemExit('Specialist trend block not found')
          text = text.replace(old_spec, new_spec, 1)
          app.write_text(text)
          PY

          python -m py_compile app.py pass_logic.py

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pass_logic.py
          git commit -m "Clarify historical PASS grade context"
          git push

name: Install PASS Phase 1 and 2

on:
  push:
    paths:
      - '.upgrade2/trigger2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore upgraded application
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import zlib

          app_payload = ''.join(
              pathlib.Path(f'.upgrade2/app.part{i}.b64').read_text().strip()
              for i in range(4)
          )
          pathlib.Path('app.py').write_bytes(
              zlib.decompress(base64.b64decode(app_payload))
          )

          logic_payload = ''.join(
              pathlib.Path(f'.upgrade2/logic.part{i}.b64').read_text().strip()
              for i in range(3)
          )
          pathlib.Path('pass_logic.py').write_bytes(
              zlib.decompress(base64.b64decode(logic_payload))
          )
          PY
          python -m py_compile app.py pass_logic.py

      - name: Commit Phase 1 and 2 upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pass_logic.py
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Add PASS longitudinal analytics and role workflows"
          git push
